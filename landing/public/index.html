<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>skipr — on GitHub</title>
    <meta name="description" content="skipr lives on GitHub. Open-source product carta and docs at github.com/mgatorr/skipr." />
    <meta http-equiv="refresh" content="2;url=https://github.com/mgatorr/skipr" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root { color-scheme: light; --bg: #f1ead9; --ink: #332a20; --accent: #cf4f27; --muted: #6b5e4f; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 2rem; background: var(--bg); color: var(--ink); font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; line-height: 1.5; }
      main { max-width: 28rem; text-align: center; }
      h1 { margin: 0 0 0.75rem; font-size: clamp(2rem, 6vw, 2.75rem); font-weight: 700; letter-spacing: -0.03em; }
      p { margin: 0 0 1.5rem; color: var(--muted); font-size: 1.05rem; }
      a.cta { display: inline-block; padding: 0.85rem 1.4rem; border-radius: 999px; background: var(--ink); color: var(--bg); text-decoration: none; font-weight: 600; font-size: 1.05rem; }
      a.cta:hover, a.cta:focus-visible { background: var(--accent); outline: none; }
      .note { margin-top: 1.25rem; font-size: 0.9rem; color: var(--muted); }
      .note a { color: var(--ink); }
    </style>
    <script>setTimeout(function(){window.location.replace("https://github.com/mgatorr/skipr");},2000);</script>
  </head>
  <body>
    <main>
      <h1>skipr</h1>
      <p>The marketing site is parked. skipr lives on GitHub — product carta, docs, and source in one place.</p>
      <a class="cta" href="https://github.com/mgatorr/skipr">Open github.com/mgatorr/skipr</a>
      <p class="note">Redirecting in a couple of seconds. <a href="https://github.com/mgatorr/skipr">Go now</a>.</p>
    </main>
  </body>
</html>
