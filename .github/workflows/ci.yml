name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: gitleaks (whole repo tree + history)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'

  install-script-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: bash -n scripts/install-macos.sh
        run: bash -n scripts/install-macos.sh
      - name: refuse on non-Darwin (including --dry-run)
        run: |
          set -e
          if ./scripts/install-macos.sh --dry-run > /tmp/install-out.txt 2>&1; then
            echo "expected non-zero exit on Linux" >&2
            cat /tmp/install-out.txt
            exit 1
          fi
          cat /tmp/install-out.txt
          grep -qi 'macos-only' /tmp/install-out.txt
          if grep -q '## Homebrew' /tmp/install-out.txt; then
            echo "installer continued past the OS gate" >&2
            exit 1
          fi
          ./scripts/install-macos.sh --help >/tmp/install-help.txt

  harness-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: English and Spanish checker fixtures
        run: bash scripts/test-harness-checks.sh
      - name: Docs check redaction
        run: bash scripts/test-check-docs.sh
      - name: Provenance lines stay redacted
        run: bash scripts/test-check-docs-provenance.sh
      - name: README step 4
        run: bash scripts/test-readme-step4.sh
      - name: README blocks in interactive zsh
        run: bash scripts/test-readme-zsh.sh
      - name: README starts claude only after the clone
        run: bash scripts/test-readme-claude.sh
      - name: skipr.dev docs links land on a file
        run: bash scripts/test-landing-redirects.sh
      - name: fdd undo
        run: bash scripts/test-fdd-undo.sh
      - name: fdd commit
        run: bash scripts/test-fdd-commit.sh
      - name: fdd context meter
        run: bash scripts/test-fdd-context.sh
      - name: fdd setup --user
        run: bash scripts/test-fdd-setup.sh

  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: check docs
        env:
          DOCS_BANNED: ${{ secrets.DOCS_BANNED }}
        run: ./scripts/check-docs.sh
