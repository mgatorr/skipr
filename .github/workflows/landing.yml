name: landing

on:
  push:
    branches: [main]
    paths: ['landing/**', '.github/workflows/landing.yml']
  pull_request:
    paths: ['landing/**', '.github/workflows/landing.yml']

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: gitleaks (tree + history)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'

  stub-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: verify static GitHub stub
        run: |
          test -f landing/public/index.html
          test -f landing/public/es/index.html
          test -f landing/vercel.json
          grep -q github.com/mgatorr/skipr landing/public/index.html
          grep -q '"framework": null' landing/vercel.json
          grep -q '"outputDirectory": "public"' landing/vercel.json
