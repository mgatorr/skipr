name: landing

on:
  push:
    branches: [main, '001-landing-waitlist']
    paths: ['landing/**', '.github/workflows/landing.yml']
  pull_request:
    paths: ['landing/**', '.github/workflows/landing.yml']

defaults:
  run:
    working-directory: landing

jobs:
  secret-scan:
    # Principle II: secret scan over the working tree AND full git history.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (tree + history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'

  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: landing/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          WAITLIST_DRY_RUN: '1'
      - run: pnpm build
      - name: Lighthouse CI (>= 95 perf/seo/a11y)
        run: pnpm lighthouse
