name: landing

on:
  push:
    branches: [main]
    paths: ['landing/**', '.github/workflows/landing.yml']
  pull_request:
    paths: ['landing/**', '.github/workflows/landing.yml']

jobs:
  stub-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: verify static GitHub stub
        run: |
          test -f landing/public/index.html
          test -f landing/public/es/index.html
          test -f landing/vercel.json
          grep -q github.com/mgatorr/skipr landing/public/index.html
          grep -q github.com/mgatorr/skipr landing/public/es/index.html
          grep -q 'og:title' landing/public/index.html
          grep -q 'og:title' landing/public/es/index.html
          grep -q '"framework": null' landing/vercel.json
          grep -q '"outputDirectory": "public"' landing/vercel.json
          # Dead Astro marketing source must stay gone
          test ! -d landing/src
