name: install-macos-test

on:
  pull_request:
    paths:
      - "scripts/install-macos.sh"
      - "scripts/test-install-macos.sh"
      - "scripts/test-fdd-undo.sh"
      - "scripts/test-fdd-commit.sh"
      - "scripts/test-fdd-context.sh"
      - "skills/**"
      - ".github/workflows/install-macos-test.yml"
  push:
    branches: [main]
    paths:
      - "scripts/install-macos.sh"
      - "scripts/test-install-macos.sh"
      - "scripts/test-fdd-undo.sh"
      - "scripts/test-fdd-commit.sh"
      - "scripts/test-fdd-context.sh"
      - "skills/**"
      - ".github/workflows/install-macos-test.yml"

jobs:
  installer:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run installer scenarios
        run: bash scripts/test-install-macos.sh
      - name: fdd undo on the bash that ships with macOS
        run: /bin/bash scripts/test-fdd-undo.sh
      - name: fdd commit on the bash that ships with macOS
        run: /bin/bash scripts/test-fdd-commit.sh
      - name: fdd context meter on the bash that ships with macOS
        run: /bin/bash scripts/test-fdd-context.sh
